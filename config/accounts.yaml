# Account registry.
#
# docs/DESIGN.md: "Account aliases are declared once in config/accounts.yaml;
# directory name must match the alias exactly. That registry is the join point
# for everything downstream."
#
# The alias IS the directory name under data/raw/. Renaming an account means
# renaming the directory and this key together, in one commit.
#
# Deliberately contains no balances, account numbers, or routing numbers. Real
# figures live only under data/ (gitignored) and in the local DuckDB file.

version: 1

accounts:
  - alias: nfcu-checking
    institution: Navy Federal Credit Union
    type: checking
    currency: USD
    # Asset: a positive balance is money the captain has.
    balance_sign: asset
    adapter: nfcu_csv

  - alias: nfcu-cc
    institution: Navy Federal Credit Union
    type: credit_card
    currency: USD
    # Liability: the institution reports a negative ledger balance when money
    # is owed, so the same asset-style arithmetic works unchanged.
    balance_sign: liability
    adapter: nfcu_csv
    # The NFCU credit-card export carries no product name, so this uses the
    # plain alias rather than DESIGN.md's `nfcu-cc-<cardname>` example. If a
    # second card is ever added, both the directory and this key must be
    # renamed in the same commit.

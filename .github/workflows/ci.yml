# Public CI for a public repository that holds nothing.
#
# The machine purser is developed on holds the captain's real financial corpus; this
# repository holds none of it, and neither does this workflow. Everything here runs on
# GitHub-hosted runners against `tests/fixtures/`, which is synthetic by construction and
# held to that by `scripts/check_fixture_provenance.py`.
#
# The shape is deliberately unprivileged, because a fork's pull request causes this file
# to run its author's code:
#
#   - `pull_request`, never `pull_request_target`: a fork's run gets a read-only token
#     scoped to the fork, and no access to secrets.
#   - `permissions: contents: read` at the top level, so a job added later inherits read
#     and has to ask, in writing, for anything more.
#   - `persist-credentials: false`, so the checkout leaves no token in `.git/config` for
#     a later step -- or a dependency's build hook -- to find.
#   - No secrets, no artifacts, no `workflow_run` follow-up that would unpack a fork's
#     build output with this repository's permissions.
#
# `scripts/check_workflow_policy.py` enforces those shapes plus SHA-pinned actions, and
# runs as part of the suite below -- so this file is checked by the run it starts.
# GitHub enforces the pinning independently: the repository has `sha_pinning_required`
# set, and rejects a workflow that references an action by tag.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the pull request's code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # One version, matching `requires-python = ">=3.12"`. A matrix would multiply
      # minutes without testing anything this project's code is sensitive to.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install purser and its dev extras
        run: python -m pip install -e '.[dev]'

      # The suite is the coverage: migrations, schema, synthetic ingestion, idempotency,
      # overlapping-export dedupe, reconciliation, provenance and precedence, and the
      # privacy invariants -- including the fixture-provenance and workflow-policy
      # guards, which are test modules as well as standalone commands. Nothing here
      # re-states any of that in YAML.
      - name: Run the test suite
        run: python -m pytest

      # Not part of the suite, and the one check that reads configuration rather than
      # code. `--no-private` is what public CI can see: the tracked taxonomy and the
      # tracked generic rules, never the captain's overlay.
      - name: Check category references (tracked layer only)
        run: python scripts/check_category_refs.py --no-private
